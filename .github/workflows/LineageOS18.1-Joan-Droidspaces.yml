name: Build LineageOS 18.1 Joan Droidspaces Kernel

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build Joan Droidspaces kernel by ${{ github.actor }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up build environment
        run: |
          set -euo pipefail
          echo "BUILD_TIME=$(date '+%y%m%d')" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            automake bc bison build-essential bzip2 ccache curl dpkg-dev flex \
            g++-multilib git gperf libc6-dev-i386 libbz2-dev liblz4-tool \
            libncurses5-dev libssl-dev lzop make patch python3 python-is-python3 \
            squashfs-tools zip zlib1g-dev
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Download AOSP Clang
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b \
            clang-aosp

      - name: Download AOSP GCC toolchains
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc-64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc-32

      - name: Download Joan kernel source
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 --branch lineage-18.1 \
            https://github.com/SGCMarkus/android_kernel_lge_msm8998.git \
            android-kernel
          sed -i 's/ -dirty//g' android-kernel/scripts/setlocalversion || true

      - name: Apply Droidspaces non-GKI patches
        working-directory: kernel_workspace/android-kernel
        run: |
          set -euo pipefail

          # 1) cgroup prefix fix (4.4 路径是 kernel/cgroup.c)
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/patches/droidspaces-4.4-cgroup-prefix.patch"
          patch -p1 < "$GITHUB_WORKSPACE/patches/droidspaces-4.4-cgroup-prefix.patch"

          # 2) xt_qtaguid panic fix
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            patch --dry-run -p1 < "$GITHUB_WORKSPACE/patches/droidspaces-4.4-xt_qtaguid.patch"
            patch -p1 < "$GITHUB_WORKSPACE/patches/droidspaces-4.4-xt_qtaguid.patch"
          else
            echo "xt_qtaguid.c not found, skip qtaguid patch"
          fi

      - name: Configure and build Joan kernel
        working-directory: kernel_workspace/android-kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH"
          export KBUILD_BUILD_HOST=GitHub-Actions
          export KBUILD_BUILD_USER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')

          BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
          EX_CMD=""

          make O=out ARCH=arm64 CC=clang $BA_CMD $EX_CMD lineageos_h930_defconfig

          scripts/kconfig/merge_config.sh -m -O out \
            out/.config "$GITHUB_WORKSPACE/configs/droidspaces-joan.config"

          make O=out ARCH=arm64 CC=clang $BA_CMD $EX_CMD olddefconfig

          # 强制确认 Droidspaces 关键配置
          required_y=(
            SYSCTL SYSVIPC POSIX_MQUEUE
            NAMESPACES PID_NS UTS_NS IPC_NS USER_NS
            SECCOMP SECCOMP_FILTER
            CGROUPS CGROUP_DEVICE CGROUP_PIDS MEMCG CGROUP_SCHED FAIR_GROUP_SCHED CGROUP_FREEZER
            DEVTMPFS OVERLAY_FS
            TMPFS_POSIX_ACL TMPFS_XATTR
            NET_NS VETH BRIDGE BRIDGE_NETFILTER
            NETFILTER NF_CONNTRACK
            IP_NF_IPTABLES IP_NF_FILTER
            NF_NAT IP_NF_NAT IP_NF_TARGET_MASQUERADE
            NETFILTER_XT_MATCH_ADDRTYPE
          )

          for option in "${required_y[@]}"; do
            if ! grep -qx "CONFIG_${option}=y" out/.config; then
              echo "Required Droidspaces option CONFIG_${option}=y is missing"
              grep -n "CONFIG_${option}" out/.config || true
              exit 1
            fi
          done

          # 旧内核上必须关闭，否则容器网络常挂
          if grep -qx "CONFIG_ANDROID_PARANOID_NETWORK=y" out/.config; then
            echo "CONFIG_ANDROID_PARANOID_NETWORK must be disabled"
            exit 1
          fi

          make -j"$(nproc --all)" O=out ARCH=arm64 CC=clang $BA_CMD $EX_CMD

          # 这个树默认 BUILD_ARM64_APPENDED_DTB_IMAGE=y
          if [ -s out/arch/arm64/boot/Image.gz-dtb ]; then
            KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb
          elif [ -s out/arch/arm64/boot/Image.gz ]; then
            KERNEL_IMAGE=out/arch/arm64/boot/Image.gz
          elif [ -s out/arch/arm64/boot/Image ]; then
            KERNEL_IMAGE=out/arch/arm64/boot/Image
          else
            echo "No kernel image produced"
            ls -lah out/arch/arm64/boot || true
            exit 1
          fi

          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"
          cp -v "$KERNEL_IMAGE" "$GITHUB_WORKSPACE/kernel_workspace/kernel-image-final"
          cp -v out/.config "$GITHUB_WORKSPACE/kernel_workspace/kernel.config"
          ls -lah "$KERNEL_IMAGE"

      - name: Package AnyKernel3 zip
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          git clone --depth=1 https://github.com/JacoaFur/AnyKernel3-Fork AnyKernel3

          # AnyKernel 优先吃 Image.gz-dtb / Image
          BASENAME=$(basename "$KERNEL_IMAGE")
          case "$BASENAME" in
            Image.gz-dtb) cp -v kernel-image-final AnyKernel3/Image.gz-dtb ;;
            Image.gz)     cp -v kernel-image-final AnyKernel3/Image.gz ;;
            Image)        cp -v kernel-image-final AnyKernel3/Image ;;
            *)            cp -v kernel-image-final AnyKernel3/Image.gz-dtb ;;
          esac

          # 改成 Droidspaces 标识，去掉 KernelSU 字样
          sed -i 's/KernelSU-Next/Droidspaces/g' AnyKernel3/anykernel.sh || true
          sed -i 's/kernel.string=.*/kernel.string=LineageOS Droidspaces kernel for LG V30 (joan)/' AnyKernel3/anykernel.sh || true

          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md

          cd AnyKernel3
          zip -r9 \
            "$GITHUB_WORKSPACE/kernel_workspace/AK3-LOS18.1-Joan-Droidspaces-${BUILD_TIME}.zip" \
            ./*
          ls -lah "$GITHUB_WORKSPACE/kernel_workspace/AK3-LOS18.1-Joan-Droidspaces-${BUILD_TIME}.zip"

      - name: Upload kernel image and config
        uses: actions/upload-artifact@v4
        with:
          name: Image-LOS18.1-Joan-Droidspaces-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/kernel-image-final
            kernel_workspace/kernel.config
          if-no-files-found: error

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: AK3-LOS18.1-Joan-Droidspaces-${{ env.BUILD_TIME }}
          path: kernel_workspace/AK3-LOS18.1-Joan-Droidspaces-*.zip
          if-no-files-found: error
